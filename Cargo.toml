[package]
name = "ch32v003_ili9341_dma"
version = "0.1.0"
edition = "2021"

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", default-features = false, features = [
    "ch32v003f4p6",
    "time-driver-tim2",
    "rt",
    "memory-x",
] }

qingke-rt = "0.7"
qingke = "0.7"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"

# Lets us drive the HAL's async (DMA) SPI from a plain `qingke_rt::entry`
# without pulling in a full embassy executor.
embassy-futures = "0.1.1"

# Text/graphics rendering (fonts, shapes) on the display.
embedded-graphics = "0.8.1"

[profile.dev]
opt-level = 's'

[profile.release]
strip = false     # symbols are not flashed to the microcontroller, so don't strip them.
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
